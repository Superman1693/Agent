spring:
  application:
    name: ai-agent
  profiles:
    active: local  # 激活 local 环境
  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        max-document-batch-size: 10000
    mcp:
      client:
        initialized: true
        request-timeout: 60s
#        stdio:
#          servers-configuration: classpath:mcp-servers.json
        sse:
          connections:
            server1:
              url: http://localhost:8127
  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
logging:
  level:
    org.springframework.web.client.RestClient: DEBUG
    com.alibaba.cloud.ai.dashscope: DEBUG
    com.ahead.aiagent.advisor: DEBUG # 必须开 DEBUG 级别
server:
  port: 8123
  servlet:
    context-path: /api

# 接口文档
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.ahead.aiagent.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

# JWT 配置
jwt:
  secret: ${JWT_SECRET:ai-agent-jwt-secret-key-must-be-at-least-32-chars}
  expiration: 86400000  # 24小时（毫秒）

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 阿里云 OSS
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET:}
    domain: ${ALIYUN_OSS_DOMAIN:}